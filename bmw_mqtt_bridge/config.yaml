name: "BMW CarData MQTT Bridge"
version: "1.1.5"
slug: "bmw_mqtt_bridge"
description: "Streams BMW CarData vehicle telemetry into MQTT / HA MQTT Discovery"
url: "https://github.com/basvb1992/HomeAssistant/tree/main/bmw-mqtt-bridge-addon"
# Only the two most common HAOS host architectures are enabled by default.
# Add armv7/armhf/i386 here too if your host needs them (the public node:20-alpine
# image is multi-arch, so this is just a matter of listing them).
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
# Grants a short-lived SUPERVISOR_TOKEN (env var) for calling Home Assistant's
# Core API (used to send the one-time BMW login link via notify.*, list notify.*
# services for the Web UI dropdown, and to save options / restart itself from
# the Web UI via the Supervisor's /addons/self/* endpoints - callable with just
# this scope, no extra hassio_api permission needed).
homeassistant_api: true
# Serves a small configuration Web UI (pick which of the ~250 BMW telemetry
# parameters to publish, and which notify.* device gets the login link) via
# Supervisor Ingress - no exposed ports, only reachable through the HA UI's
# "OPEN WEB UI" button by an already-authenticated user.
ingress: true
ingress_port: 8099
panel_icon: mdi:car-electric
# Auto-discovers your MQTT broker (the Mosquitto add-on) and injects
# MQTT_HOST / MQTT_PORT / MQTT_USERNAME / MQTT_PASSWORD / MQTT_SSL as env vars.
# This only works if the broker add-on actually registers itself as the "mqtt"
# service with Supervisor (the official "Mosquitto broker" add-on does, but a
# restart of that add-on is sometimes needed for it to (re-)register). If this
# add-on still reports "no MQTT broker service found" even though your broker
# is running, fill in mqtt_host/mqtt_port/mqtt_username/mqtt_password manually
# below to bypass auto-discovery entirely.
services:
  - mqtt:want
options:
  client_id: ""
  gcid: ""
  # Deprecated: comma-separated VIN list. Kept only so existing installs keep
  # working after upgrading to "vehicles" below - new setups should use "vehicles"
  # instead, which also lets you give each car a friendly name (e.g. "X5").
  vin: ""
  vehicles: []
  login_email: ""
  notify_service: "mobile_app_bas_prive"
  discovery_prefix: "homeassistant"
  local_prefix: "bmw/"
  mqtt_discovery: true
  split_topics: false
  mqtt_retain: false
  include_keys: ""
  exclude_keys: ""
  mqtt_host: ""
  mqtt_username: ""
  mqtt_password: ""
  mqtt_ssl: false
schema:
  # "password" fields are masked in the Supervisor UI and stored in the add-on's
  # own options store on the HA host (root-only file), not in .env, not in git,
  # not in the recorder/logbook.
  client_id: "password"
  gcid: "password"
  vin: "str?"
  # Repeatable list - Supervisor renders this as an add/remove row form in the
  # Configuration tab ("+ Add"), one row per car. "name" is optional; if left
  # blank the device shows up in HA as "BMW <vin>" instead of "BMW <name>".
  vehicles:
    - vin: "str"
      name: "str?"
  login_email: "str?"
  notify_service: "str?"
  discovery_prefix: "str"
  local_prefix: "str"
  mqtt_discovery: "bool"
  split_topics: "bool"
  mqtt_retain: "bool"
  include_keys: "str"
  exclude_keys: "str"
  # Manual MQTT override - only needed if service auto-discovery (above) fails.
  # Leave mqtt_host empty (default) to keep using Supervisor auto-discovery.
  mqtt_host: "str?"
  mqtt_port: "port?"
  mqtt_username: "str?"
  mqtt_password: "password?"
  mqtt_ssl: "bool?"
